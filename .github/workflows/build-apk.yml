name: Build Debug APKs (Customer, Rider, Store)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "::error::Java version must be 17 or newer. Detected version: $JAVA_VER"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_VER)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore at ./debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "./debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore confirmed at ./debug.keystore."

      - name: Build all 3 debug APKs
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon > gradle_build.log 2>&1
          GRADLE_EXIT=$?
          cat gradle_build.log
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $GRADLE_EXIT"
            {
              echo "### ❌ Gradle Build Failed"
              echo "\`\`\`"
              tail -n 120 gradle_build.log
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit $GRADLE_EXIT
          fi

      - name: Verify & collect all APKs
        id: collect_apks
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          echo "temp_dir=$TEMP_RELEASE_DIR" >> "$GITHUB_OUTPUT"

          # Discover and verify Customer APK
          CUSTOMER_APK=$(find app/build/outputs/apk -name "*customer*debug*.apk" | head -n 1)
          if [ -z "$CUSTOMER_APK" ] || [ ! -f "$CUSTOMER_APK" ]; then
            CUSTOMER_APK=$(find app/build/outputs/apk -name "*debug*.apk" | head -n 1)
          fi

          # Discover and verify Rider APK
          RIDER_APK=$(find app/build/outputs/apk -name "*rider*debug*.apk" | head -n 1)

          # Discover and verify Store APK
          STORE_APK=$(find app/build/outputs/apk -name "*store*debug*.apk" | head -n 1)

          echo "Discovered APKs:"
          echo "Customer APK: $CUSTOMER_APK"
          echo "Rider APK: $RIDER_APK"
          echo "Store APK: $STORE_APK"

          # Prepare release filenames
          CUSTOMER_OUT="${TEMP_RELEASE_DIR}/cartcraze-customer-debug.apk"
          RIDER_OUT="${TEMP_RELEASE_DIR}/cartcraze-rider-debug.apk"
          STORE_OUT="${TEMP_RELEASE_DIR}/cartcraze-store-debug.apk"

          if [ -n "$CUSTOMER_APK" ] && [ -f "$CUSTOMER_APK" ]; then
            cp "$CUSTOMER_APK" "$CUSTOMER_OUT"
            echo "has_customer=true" >> "$GITHUB_OUTPUT"
            echo "customer_path=$CUSTOMER_OUT" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$RIDER_APK" ] && [ -f "$RIDER_APK" ]; then
            cp "$RIDER_APK" "$RIDER_OUT"
            echo "has_rider=true" >> "$GITHUB_OUTPUT"
            echo "rider_path=$RIDER_OUT" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$STORE_APK" ] && [ -f "$STORE_APK" ]; then
            cp "$STORE_APK" "$STORE_OUT"
            echo "has_store=true" >> "$GITHUB_OUTPUT"
            echo "store_path=$STORE_OUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Customer APK artifact
        if: steps.collect_apks.outputs.has_customer == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cartcraze-customer-apk
          path: ${{ steps.collect_apks.outputs.customer_path }}
          if-no-files-found: error

      - name: Upload Rider APK artifact
        if: steps.collect_apks.outputs.has_rider == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cartcraze-rider-apk
          path: ${{ steps.collect_apks.outputs.rider_path }}
          if-no-files-found: warn

      - name: Upload Store APK artifact
        if: steps.collect_apks.outputs.has_store == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cartcraze-store-apk
          path: ${{ steps.collect_apks.outputs.store_path }}
          if-no-files-found: warn

      - name: Publish all APKs to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Version ==="
          gh --version

          TEMP_DIR="${{ steps.collect_apks.outputs.temp_dir }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="CartCraze 3-in-1 Apps Build #${{ github.run_number }}"

          NOTES_FILE=$(mktemp)
          {
            echo "### 🚀 CartCraze 3-in-1 Native Android Apps"
            echo ""
            echo "Download the standalone APKs directly to your phone:"
            echo "- 🛒 **Customer App**: \`cartcraze-customer-debug.apk\`"
            echo "- 🛵 **Rider Partner App**: \`cartcraze-rider-debug.apk\`"
            echo "- 🏬 **Dark Store Merchant App**: \`cartcraze-store-debug.apk\`"
            echo ""
            echo "---"
            echo "- **Build Source**: Automatically generated by GitHub Actions"
            echo "- **Workflow Run**: #${{ github.run_number }} (Attempt #${{ github.run_attempt }})"
            echo "- **Commit SHA**: \`${{ github.sha }}\`"
            echo "- **Android SDK**: API 35 (Android 15) / minSdk 24 (Android 7.0+)"
          } > "$NOTES_FILE"

          # Collect all APK assets in the directory
          ASSETS=()
          for apk in "$TEMP_DIR"/*.apk; do
            if [ -f "$apk" ]; then
              ASSETS+=("$apk")
            fi
          done

          echo "Creating GitHub Release with ${#ASSETS[@]} APK assets..."
          gh release create "$RELEASE_TAG" \
            "${ASSETS[@]}" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="CartCraze 3-in-1 Apps Build #${{ github.run_number }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================="
            echo "🎉 GitHub Release Published Successfully!"
            echo "=========================================="
            gh release view "$RELEASE_TAG"

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"

            {
              echo "## 📱 CartCraze 3-in-1 APKs Available for Download"
              echo ""
              echo "The following standalone APKs are published under [GitHub Release $RELEASE_TITLE]($RELEASE_URL):"
              echo "- 🛒 **Customer App**: \`cartcraze-customer-debug.apk\`"
              echo "- 🛵 **Rider Delivery App**: \`cartcraze-rider-debug.apk\`"
              echo "- 🏬 **Dark Store App**: \`cartcraze-store-debug.apk\`"
              echo ""
              echo "👉 [Open Releases Page to Download APKs]($RELEASE_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing encountered an issue or was skipped."
            echo "The debug APK builds are preserved in the GitHub Actions artifacts section."

            {
              echo "## 📱 Debug APK Build Summary"
              echo ""
              echo "All 3 APKs built successfully and are preserved in GitHub Actions artifacts:"
              echo "- \`cartcraze-customer-apk\`"
              echo "- \`cartcraze-rider-apk\`"
              echo "- \`cartcraze-store-apk\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
